name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["docs/data.json"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install pyflakes -r ml/requirements.txt
      - name: Lint
        run: python -m pyflakes ml airflow
      - name: Import the ML code
        run: |
          cd ml
          python -c "import train, publish, record_run"
      - name: Shell syntax
        run: bash -n ml/deploy/mercantile-ml-remote
